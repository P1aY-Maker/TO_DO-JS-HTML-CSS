<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="styles.css" />
    <title>TO-DO</title>
  </head>
  <body>
    <section id="header-section">
      <div class="todo-container">
        <h1 class="head-text">T O D O</h1>
        <img src="/Styles/icon-sun.svg" class="logo-sun" alt="" />
        <input class="input-field" type="text" placeholder="Currently typing" />
      </div>
    </section>
    <!-- TODO content -->
    <section id="content-section">
      <div class="todo-content-container">
        <div class="todo-content">
          <ul class="todo-items">
            <li class="todo-things flex gap-2">
              <label>
                <input type="radio" />
                <span> </span>
              </label>
              <span>Jog</span>
              <a href="#" class="cancel-btn">X</a>
            </li>
            <li class="todo-things flex gap-2">
              <label>
                <input type="radio" />
                <span> </span>
              </label>
              <span>Jog around the park 3x</span>
              <a href="#" class="cancel-btn">X</a>
            </li>

            <li class="todo-things flex gap-2">
              <label>
                <input type="radio" />
                <span></span>
              </label>
              <span>10 minutes meditation</span>
              <a href="#" class="cancel-btn">X</a>
            </li>
            <li class="todo-things flex gap-2">
              <label>
                <input type="radio" />
                <span></span>
              </label>
              <span>Read for one hour</span>
              <a href="#" class="cancel-btn">X</a>
            </li>
            <li class="todo-things flex gap-2">
              <label>
                <input type="radio" />
                <span></span>
              </label>
              <span>Pick up groceries</span>
              <a href="#" class="cancel-btn">X</a>
            </li>
            <li class="todo-things flex gap-2">
              <label>
                <input type="radio" />
                <span></span>
              </label>
              <span>Complete TODO app on front-end mentor</span>
              <a href="#" class="cancel-btn">X</a>
            </li>
          </ul>
          <div class="task-info flex jus-spacebw">
            <p>5 tasks left</p>
            <ul class="flex gap-2">
              <li>
                <a href="#">All tasks</a>
              </li>
              <li>
                <a href="#">Active</a>
              </li>
              <li>
                <a href="#">Completed</a>
              </li>
            </ul>
            <a href="#">Clear completed</a>
          </div>
        </div>
      </div>
    </section>
  </body>
</html>
