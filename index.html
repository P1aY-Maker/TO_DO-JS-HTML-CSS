<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="styles.css" />
    <title>TO-DO</title>
  </head>
  <body>
    <section id="header-section">
      <div class="todo-container">
        <div class="wrapper">
          <h1 class="head-text">T O D O</h1>
          <img src="/Styles/icon-sun.svg" class="logo-sun" alt="" />
          <input
            class="input-field"
            type="text"
            placeholder="Currently typing"
          />
        </div>
      </div>
    </section>
    <!-- TODO content -->
    <section id="content-section">
      <div class="todo-content-container">
        <div class="todo-content">
          <ul class="todo-items"></ul>
          <div class="task-info flex jus-spacebw">
            <p>5 tasks left</p>
            <ul class="flex gap-2">
              <li>
                <a id="all-task" href="#">All tasks</a>
              </li>
              <li>
                <a id="active-task" href="#">Active</a>
              </li>
              <li>
                <a id="completed-task" href="#">Completed</a>
              </li>
            </ul>
            <a id="clear-completed" href="#">Clear completed</a>
          </div>
        </div>
      </div>
    </section>
    <script type="module" src="app-2.js"></script>
  </body>
</html>
